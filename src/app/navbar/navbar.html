<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-lg-5">

        <div class="navTxt">
            <h1>Wizard's Market</h1>
            <p>Your Gateway to Diagon Alley</p>
        </div>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarContent"
            aria-controls="navbarContent"
            aria-expanded="false"
            aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>

        @if (isShopPage) {

            <!-- Desktop Search -->
            <div class="search d-none d-lg-flex">

                <input
                    type="text"
                    [(ngModel)]="searchInput"
                    (keydown.enter)="search()"
                    placeholder="Search magical items..."
                >

                <button id="searchbtn" (click)="search()">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>

            </div>

        }

        <div
            class="collapse navbar-collapse justify-content-end"
            id="navbarContent">

            @if (isShopPage) {

                <!-- Mobile Search -->
                <div class="search d-flex d-lg-none mb-3">

                    <input
                        type="text"
                        [(ngModel)]="searchInput"
                        (keydown.enter)="search()"
                        placeholder="Search magical items..."
                    >

                    <button id="searchbtn" (click)="search()">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>

                </div>

            }

            <ul class="navbar-nav align-items-lg-center gap-lg-4">

                <li class="nav-item">
                    <a
                        class="nav-link"
                         routerLink="/">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" routerLink="/" fragment="shop">
                        Shop
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" routerLink="/" fragment="contact">
                        Owl Post
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" routerLink="/cart">
                        My Vault
                    </a>
                </li>

                <li class="nav-item">
                    <a routerLink="/login">
                        <img src="images/Quill.png" alt="profile">
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>
