<section class="contact py-5" id="contact">

    <div class="shopTxt container text-center">

        <h1>Send an Owl</h1>

        <p class="mx-auto">
            Need help finding the perfect magical item?
            Send us an owl and we'll get back to you.
        </p>

    </div>

    <div class="contactContainer container">

        <div class="row justify-content-center">

            <div class="col-12 col-md-10 col-lg-8">
               
                <form #contactForm="ngForm" (ngSubmit)="submitForm()">
                    
                    <div class="inputGroup mb-4">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" placeholder="Harry Potter" [(ngModel)]="contact.name"
                            #name="ngModel" required (blur)="name.control.markAsTouched()">
                        <p *ngIf="name.invalid && name.touched" class="text-danger pError">
                            Please enter your name
                        </p>

                    </div>

                    <div class="inputGroup mb-4">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" placeholder="wizard@hogwarts.com"
                            [(ngModel)]="contact.email" #email="ngModel" required email
                            (blur)="email.control.markAsTouched()">

                        <p *ngIf="email.invalid && email.touched" class="text-danger pError">
                            Please enter a valid email
                        </p>

                    </div>

                    <div class="inputGroup mb-4">
                        <label for="message">Your Message</label>
                        <textarea name="message" id="message" placeholder="Write your owl message..."
                            [(ngModel)]="contact.message" #message="ngModel" required
                            (blur)="message.control.markAsTouched()"></textarea>
                        <p *ngIf="message.invalid && message.touched" class="text-danger pError">
                            Please enter your message
                        </p>
                    </div>

                    <button type="submit" class="sendBtn" [disabled]="contactForm.invalid">
                        Send Owl 🦉
                    </button>
                    
                </form>
                

            </div>

        </div>

    </div>

</section>
